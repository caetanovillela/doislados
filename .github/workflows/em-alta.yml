name: Atualizar Em alta
on:
  schedule:
    - cron: "23 * * * *"   # a cada hora (o GitHub às vezes pula ou atrasa execuções agendadas)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ferramentas/em_alta.py, .github/workflows/em-alta.yml]
permissions:
  contents: write
concurrency:
  group: em-alta
  cancel-in-progress: false
jobs:
  em-alta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 ferramentas/em_alta.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add dados/em-alta.js
          git commit -m "Em alta: atualização automática a partir da imprensa" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
