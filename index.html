<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dois Lados</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=Schibsted+Grotesk:wght@400..900&display=swap">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("tema");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="casca">
  <header class="topo">
    <div class="topo-linha">
      <a class="marca" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5a10.5 10.5 0 0 0 0 21z" fill="currentColor"/></svg>Dois Lados</a>
      <form class="busca-topo" id="form-busca" role="search">
        <label for="busca-global" class="sr">Buscar tema</label>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2"/></svg>
        <input id="busca-global" type="search" placeholder="Buscar tema ou instituição" autocomplete="off">
      </form>
      <div class="menu">
        <button type="button" class="icone" id="menu-botao" aria-expanded="false" aria-controls="menu-painel" aria-label="Categorias e temas" title="Categorias e temas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
        <nav class="menu-painel" id="menu-painel" aria-label="Categorias e temas" hidden></nav>
      </div>
      <button type="button" class="icone alternar-tema" id="alternar-tema" aria-pressed="false" aria-label="Mudar para o modo escuro" title="Mudar para o modo escuro"><svg class="lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7z" fill="currentColor"/></svg><svg class="sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2"/></svg></button>
    </div>
  </header>
  <main id="app"></main>
  <footer class="rodape mono"><span>Dois Lados · protótipo</span><span>Os links levam a textos de terceiros. O Dois Lados não toma partido.</span></footer>
</div>
<script src="dados/temas.js"></script>
<script src="app.js"></script>
</body>
</html>
